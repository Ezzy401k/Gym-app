  --brand-ring:#e4a191;
  --sec:#b07314;
  --sec-tx:#925d0d;
  --sec-bg:#fbf2e2;
  --ok:#1c8456;
  --ok-btn:#19774d;
  --ok-tx:#156944;
  --ok-bg:#e6f5ee;
  --ok-ring:#8ccdb0;
  --stage:#eef1f5;

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  color:var(--tx);
  font:15.5px/1.55 var(--font-body);
  -webkit-font-smoothing:antialiased;
}
button,input,select{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{font-size:16px!important}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
p{text-wrap:pretty;max-width:68ch}
h1,h2,h3{font-family:var(--font-disp);text-wrap:balance;margin:0;color:var(--tx)}
@keyframes viewIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.view-anim{animation:viewIn .18s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---- Top Bar (Flat Hairline Shell Header) ----------------------- */
.topbar{
  flex-shrink:0;z-index:25;
  background:var(--surf);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.w{max-width:760px;margin:0 auto;padding:0 18px}
@media (min-width:640px){.w{padding:0 24px}}
@media (min-width:1024px){.w,.bnav-in{max-width:820px}}
.topbar-in{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:58px;
}
.brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:32px;height:32px;border-radius:8px;
  background:var(--brand-btn);
  display:grid;place-items:center;flex-shrink:0;
}
.brand-title{font-size:19px;font-weight:800;letter-spacing:.01em;line-height:1.1}
.brand-sub{font-size:12.5px;color:var(--mu);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.wk-badge{
  font-family:var(--font-disp);font-size:13px;font-weight:700;letter-spacing:.02em;
  padding:5px 10px;border-radius:6px;
  background:var(--surf2);border:1px solid var(--line);color:var(--tx2);
  white-space:nowrap;max-width:48vw;overflow:hidden;text-overflow:ellipsis;
}
.icon-btn{
  width:40px;height:40px;border-radius:8px;
  border:1px solid var(--line);background:var(--surf2);color:var(--tx);
  display:grid;place-items:center;cursor:pointer;font-size:15px;padding:0;
}
.icon-btn:active{background:var(--surf3)}

/* ---- Dedicated Scrollable Viewport (Never Underlaps Nav) -------- */
.app-scroll{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scroll-padding-bottom:140px;
  scroll-behavior:smooth;
  position:relative;
}
main.w{padding:20px 18px 36px}
@media (min-width:640px){main.w{padding:24px 24px 40px}}
.app-scroll.has-rest main.w{padding-bottom:132px}
.stack{display:flex;flex-direction:column;gap:24px}

/* ---- Flat Editorial Surfaces (Crisp 1px Edge, Zero Muddy Shadow) */
.card{
  background:var(--surf);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px;
}
.card.flush{padding:0;overflow:hidden}
.card.done-ring{border-color:var(--ok-ring)}

h2{font-size:23px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
h3{font-size:17px;font-weight:700;letter-spacing:0;line-height:1.25}
.sec-sub{color:var(--mu);font-size:13.5px;margin:4px 0 0;line-height:1.45}
.mu{color:var(--mu);font-size:13.5px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-gap{display:flex;align-items:center;gap:10px}
.div-top{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.section-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 10px}

/* ---- Solid Flat Buttons & Segmented Controls -------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;border-radius:8px;border:1px solid transparent;
  background:var(--brand-btn);
  color:#ffffff;font:inherit;font-weight:700;font-size:14.5px;
  cursor:pointer;transition:opacity .12s,background .12s;
}
.btn:active{opacity:.86}
.btn.sec{background:var(--surf2);color:var(--tx);border-color:var(--line2)}
.btn.ok{background:var(--ok-btn);color:#ffffff}
.btn.full{width:100%}
.btn.sm{padding:9px 14px;font-size:13.5px;min-height:42px}
.btn.xs{padding:6px 11px;font-size:12.5px;border-radius:6px;min-height:36px}

.pill-sw{
  display:flex;padding:3px;border-radius:8px;
  background:var(--surf2);border:1px solid var(--line);gap:3px;
}
.pill-sw button{
  flex:1;padding:9px 10px;border:none;border-radius:6px;
  background:transparent;color:var(--mu);font:inherit;
  font-weight:700;font-size:13px;line-height:1.25;text-wrap:balance;cursor:pointer;
}
.btn.xs{padding:6px 11px;font-size:12.5px;border-radius:6px}

.pill-sw{
  display:flex;padding:3px;border-radius:8px;
  background:var(--surf2);border:1px solid var(--line);gap:3px;
}
.pill-sw button{
  flex:1;padding:9px 10px;border:none;border-radius:6px;
  background:transparent;color:var(--mu);font:inherit;
  font-weight:700;font-size:13px;cursor:pointer;
}
.pill-sw button.on{background:var(--surf);color:var(--tx);border:1px solid var(--line2)}

/* ---- Status Tags (Clean Solid Surfaces, Accessible Contrast) ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;
  white-space:nowrap;
}
.chip.p{background:var(--brand-bg);color:var(--brand-tx)}
.chip.s{background:var(--sec-bg);color:var(--sec-tx)}
.chip.o{background:var(--ok-bg);color:var(--ok-tx)}
.chip.n{background:var(--surf2);color:var(--tx2);border:1px solid var(--line)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ---- Flat Metric Strip (Hairline Dividers, Zero Nested Cards) --- */
.stat-strip{
  display:grid;grid-template-columns:repeat(4,1fr);
  margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
@media (max-width:460px){.stat-strip{grid-template-columns:repeat(2,1fr)}}
.stat-cell{
  padding:14px 8px;text-align:center;
  border-right:1px solid var(--line);
}
.stat-cell:last-child{border-right:none}
@media (max-width:460px){
  .stat-cell:nth-child(2){border-right:none}
  .stat-cell:nth-child(1),.stat-cell:nth-child(2){border-bottom:1px solid var(--line)}
}
.stat-val{
  font-family:var(--font-disp);font-size:24px;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--tx);line-height:1.1;
}
.stat-cell.hot .stat-val{color:var(--brand-tx)}
.stat-lbl{font-size:12px;font-weight:600;color:var(--mu);margin-top:4px}

.quote-box{
  background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:16px 20px;cursor:pointer;
}
.quote-txt{font-size:15px;font-weight:500;color:var(--tx);line-height:1.55;margin:0}
.quote-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mu);font-weight:600}

/* ---- Flattened Achievement Rows (Inline Icon, No Stacked Tile) -- */
.ach-list{margin-top:12px}
.ach-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.ach-row:last-child{border-bottom:none;padding-bottom:2px}
.ach-mark{
  width:28px;height:28px;border-radius:6px;flex-shrink:0;
  display:grid;place-items:center;font-size:13px;font-weight:800;
  background:var(--surf2);color:var(--mu);border:1px solid var(--line);
}
.ach-row.on .ach-mark{background:var(--ok-bg);color:var(--ok-tx);border-color:var(--ok-ring)}
.ach-mid{flex:1;min-width:0}
.ach-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ach-nm{font-size:14.5px;font-weight:700;color:var(--tx)}
.ach-st{font-size:12.5px;font-weight:700;color:var(--mu);white-space:nowrap}
.ach-row.on .ach-st{color:var(--ok-tx)}
.ach-ds{font-size:13px;color:var(--mu);margin-top:2px}
.ach-bar{height:5px;border-radius:3px;background:var(--surf2);overflow:hidden;margin-top:7px}
.ach-bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.ach-row.on .ach-bar i{background:var(--ok)}

.cel-banner{
  background:var(--ok-bg);border:1px solid var(--ok-ring);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.cel-banner b{display:block;font-size:15px;color:var(--tx)}
.cel-banner span{font-size:13px;color:var(--tx2)}

.switch-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.switch-row:last-of-type{border-bottom:none}
.sw{
  position:relative;width:46px;height:26px;border-radius:99px;
  border:1px solid var(--line2);background:var(--surf2);cursor:pointer;
  flex-shrink:0;padding:0;transition:background .15s,border-color .15s;
}
.sw::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;
  border-radius:50%;background:var(--tx);transition:transform .16s ease;
}
.sw.on{background:var(--ok-btn);border-color:var(--ok-btn)}
.sw.on::after{transform:translateX(20px);background:#ffffff}

/* ---- Today Hero & Missed Workout Alert -------------------------- */
.hero-body{display:grid;grid-template-columns:1fr;gap:20px;align-items:center}
@media (min-width:600px){.hero-body{grid-template-columns:1.1fr .9fr}}

.miss-card{
  background:var(--surf);
  border:1px solid var(--brand-ring);
  border-radius:12px;padding:18px 20px;
}
.miss-mot{
  margin:12px 0;font-size:14.5px;color:var(--tx);line-height:1.55;
}
.miss-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.miss-tag{
  font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;
  background:var(--brand-bg);color:var(--brand-tx);
}
.miss-actions{display:flex;flex-wrap:wrap;gap:8px}

/* ---- Interactive Monthly Calendar (Home Page, Flat Grid) -------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.cal-dow span{
  text-align:center;font-size:12px;font-weight:700;color:var(--mu);
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day{
  border:1px solid var(--line);background:var(--bg);
  border-radius:8px;padding:7px 2px 6px;min-height:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  cursor:pointer;color:var(--tx);font:inherit;
}
.cal-day:active{background:var(--surf2)}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-day.rest{opacity:.65}
.cal-num{font-family:var(--font-disp);font-size:15px;font-weight:700;line-height:1.1}
.cal-lbl{font-size:11.5px;font-weight:600;color:var(--mu);line-height:1}
.cal-st{font-size:12px;font-weight:800;line-height:1;height:13px;display:grid;place-items:center}
.cal-day.done{background:var(--ok-bg);border-color:var(--ok-ring)}
.cal-day.done .cal-num,.cal-day.done .cal-st,.cal-day.done .cal-lbl{color:var(--ok-tx)}
.cal-day.madeup{background:var(--sec-bg);border-color:var(--sec)}
.cal-day.madeup .cal-st{color:var(--sec-tx)}
.cal-day.miss{background:var(--brand-bg);border-color:var(--brand-ring);border-style:dashed}
.cal-day.miss .cal-num,.cal-day.miss .cal-st{color:var(--brand-tx)}
.cal-day.today{border-color:var(--sec);box-shadow:inset 0 0 0 1px var(--sec)}
.cal-day.sel{border-color:var(--tx);border-style:solid;box-shadow:0 0 0 1px var(--tx)}
.cal-leg{
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
  margin-top:12px;font-size:12px;font-weight:600;color:var(--mu);
}
.cal-leg span{display:inline-flex;align-items:center;gap:6px}
.cal-detail{
  margin-top:16px;padding-top:16px;border-top:1px solid var(--line);
}

/* ---- Clean Studio Anatomy & Form Stages (Zero Radial Glow) ------ */
.anat-stage{
  position:relative;border-radius:10px;padding:12px 10px 10px;
  background:var(--stage);
  border:1px solid var(--line);
}
.anat-stage svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.anat-stage.compact svg{max-width:270px}
.anat-stage g[data-m]{cursor:pointer}
.anat-stage g[data-m]:hover{opacity:.86}
.anat-legend{
  display:flex;justify-content:center;gap:16px;margin-top:8px;
  font-size:12px;font-weight:600;color:var(--mu);
}
.anat-legend span{display:inline-flex;align-items:center;gap:6px}
.anat-tip{
  text-align:center;font-size:12.5px;font-weight:600;color:var(--tx2);
  min-height:20px;margin-top:4px;
}

.fig-stage{
  position:relative;border-radius:10px;padding:12px 8px 6px;
  background:var(--stage);
  border:1px solid var(--line);cursor:pointer;overflow:hidden;
}
.fig-stage svg{display:block;width:100%;max-width:330px;height:210px;margin:0 auto}
.phase-badge{
  position:absolute;top:10px;left:10px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;
  background:var(--surf);color:var(--tx);border:1px solid var(--line2);
}
.phase-dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.tempo-badge{
  position:absolute;top:10px;right:10px;z-index:2;
  padding:4px 9px;border-radius:6px;font-size:12px;font-weight:700;
  background:var(--sec-bg);color:var(--sec-tx);border:1px solid var(--line);
}
.vis-shell{margin-bottom:16px}
.vis-tabs{margin-bottom:12px}
.vis-ctrl{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:10px;flex-wrap:wrap;
}
.vis-ctrl .grp{display:flex;gap:6px}
.vis-btn{
  padding:7px 12px;border-radius:6px;border:1px solid var(--line2);
  background:var(--surf2);color:var(--tx);font:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;
}
.vis-btn.on{background:var(--brand-bg);border-color:var(--brand-ring);color:var(--brand-tx)}

/* ---- Pro Form Blueprint (Clean Divider List, No Card Stack) ----- */
.tempo-strip{
  display:grid;grid-template-columns:repeat(3,1fr);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px;
}
.tempo-box{
  background:var(--surf2);padding:9px 6px;text-align:center;
  border-right:1px solid var(--line);
}
.tempo-box:last-child{border-right:none}
.tempo-box b{display:block;font-family:var(--font-disp);font-size:16px;font-weight:800;color:var(--brand-tx)}
.tempo-box span{font-size:12px;font-weight:600;color:var(--mu)}
.steps{display:flex;flex-direction:column}
.step{
  padding:11px 2px;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--tx2);line-height:1.5;
}
.step:last-child{border-bottom:none}
.step b{color:var(--tx)}
.step.breath b{color:var(--ok-tx)}
.step.feel b{color:var(--sec-tx)}
.step.bad{
  margin-top:8px;padding:11px 12px;border:1px solid var(--brand-ring);
  border-radius:8px;background:var(--brand-bg);color:var(--tx);
}
.step.bad b{color:var(--brand-tx)}

/* ---- Workout Progress, Drawers & Exercise List ------------------ */
.pbar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;width:0;border-radius:3px;background:var(--brand);transition:width .25s}
.pbar.ok i{background:var(--ok)}

.drawer-head{
  width:100%;border:none;background:none;color:inherit;font:inherit;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;cursor:pointer;text-align:left;
}
.drawer-body{padding:0 20px 14px;border-top:1px solid var(--line)}
.chev{font-size:15px;color:var(--mu);transition:transform .16s;display:inline-block}

.mob-item{padding:11px 0;border-bottom:1px solid var(--line)}
.mob-item:last-child{border-bottom:none;padding-bottom:2px}
.mob-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mob-lbl{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px;flex:1}
.mob-lbl input{margin-top:3px;width:18px;height:18px;accent-color:var(--ok-btn);flex-shrink:0}
.mob-lbl.checked span{text-decoration:line-through;color:var(--mu)}

.ex-list{
  background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;
}
.ex-card{border-bottom:1px solid var(--line)}
.ex-card:last-child{border-bottom:none}
.ex-head{
  width:100%;border:none;background:none;color:inherit;font:inherit;
  display:flex;align-items:center;gap:12px;padding:15px 18px;
  cursor:pointer;text-align:left;
}
.ex-head:active{background:var(--surf2)}
.ex-badge{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;font-family:var(--font-disp);font-weight:800;font-size:15px;
  background:var(--surf2);color:var(--tx2);border:1px solid var(--line);
}
.ex-card.open .ex-badge{background:var(--brand-bg);color:var(--brand-tx);border-color:var(--brand-ring)}
.ex-card.done .ex-badge{background:var(--ok-btn);color:#ffffff;border-color:var(--ok-btn)}
.ex-info{flex:1;min-width:0}
.ex-title{font-family:var(--font-disp);font-weight:700;font-size:16.5px;line-height:1.25}
.ex-meta{font-size:13px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta b{color:var(--tx2);font-weight:600}
.ex-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ex-count{
  font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:6px;
  background:var(--surf2);color:var(--tx2);
}
.ex-card.done .ex-count{background:var(--ok-bg);color:var(--ok-tx)}
.ex-card.open .ex-head .chev{transform:rotate(180deg)}
.ex-body{padding:16px 18px 20px;border-top:1px solid var(--line);background:var(--bg)}

.target-banner{
  padding:12px 0 14px;margin-bottom:12px;border-bottom:1px solid var(--line);
}
.target-main{font-family:var(--font-disp);font-size:17px;font-weight:700;color:var(--tx)}
.target-note{font-size:13.5px;color:var(--mu);margin-top:4px;line-height:1.45}

/* ---- Set Logging Grid ------------------------------------------- */
.set-table{display:flex;flex-direction:column;gap:8px}
.set-hdr,.set-row{
  display:grid;grid-template-columns:34px 1fr 1fr 48px;
  gap:8px;align-items:center;
}
.set-hdr.bw,.set-row.bw{grid-template-columns:34px 1fr 48px}
.set-hdr{
  font-size:12px;font-weight:700;color:var(--mu);text-align:center;padding:0 2px;
}
.set-num{
  height:38px;border-radius:8px;background:var(--surf);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--font-disp);font-size:15px;font-weight:700;color:var(--mu);
}
.set-row.done .set-num{background:var(--ok-bg);color:var(--ok-tx);border-color:var(--ok-ring)}
.num-inp{
  width:100%;height:44px;padding:0 10px;border-radius:8px;
  border:1px solid var(--line2);background:var(--surf);color:var(--tx);
  font:inherit;font-size:15.5px;font-weight:700;text-align:center;
  outline:none;font-variant-numeric:tabular-nums;
}
.num-inp:focus{border-color:var(--brand)}
.set-ck{
  width:46px;height:44px;border-radius:8px;
  border:1px solid var(--line2);background:var(--surf);color:#ffffff;
  font-size:18px;font-weight:800;cursor:pointer;
}
.set-ck.on{background:var(--ok-btn);border-color:var(--ok-btn)}

.confirm-box{
  background:var(--surf);border:1px solid var(--ok-ring);border-radius:12px;padding:18px;
}
.confirm-box p{margin:0 0 12px;font-size:14.5px;font-weight:600}
.confirm-actions{display:flex;gap:10px}

/* ---- Roadmap Flat Rows, Tables & Backup ------------------------- */
.split-list{margin-top:14px}
.split-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.split-row:last-child{border-bottom:none;padding-bottom:2px}
.split-day{
  font-family:var(--font-disp);font-size:14px;font-weight:800;
  color:var(--mu);width:42px;flex-shrink:0;
}
.blk-list{margin-top:10px}
.blk-item{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.blk-item:last-child{border-bottom:none;padding-bottom:2px}
.blk-item.cur{padding:13px 12px;margin:4px -12px;border-radius:8px;background:var(--brand-bg);border-bottom:none}
.bk-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
th{font-size:12px;color:var(--mu);font-weight:700}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
tr.cur td{background:var(--brand-bg);color:var(--tx);font-weight:700}

/* ---- Body, Ethiopian Nutrition & Waist Sparkline ---------------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin-bottom:5px}
.field input,.field select{
  width:100%;height:42px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line2);background:var(--bg);color:var(--tx);
  font:inherit;font-size:14.5px;font-weight:600;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--brand)}

.kpi-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.kpi{
  background:var(--bg);padding:13px 14px;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
}
.kpi:nth-child(2n){border-right:none}
.kpi:nth-last-child(-n+2){border-bottom:none}
.kpi b{display:block;font-family:var(--font-disp);font-size:23px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}
.mbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surf2);margin-top:12px;gap:2px}
.mbar span{display:block;height:100%;transition:width .25s}

.meal-list{margin-top:12px}
.meal-row{padding:14px 0;border-bottom:1px solid var(--line)}
.meal-row:last-child{border-bottom:none;padding-bottom:2px}
.meal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.meal-slot{font-size:12px;font-weight:700;color:var(--sec-tx)}
.meal-macro{font-size:12.5px;font-weight:700;color:var(--brand-tx)}
.meal-title{font-family:var(--font-disp);font-size:16.5px;font-weight:700;color:var(--tx);margin-bottom:3px}
.meal-desc{font-size:13.5px;color:var(--mu);line-height:1.5;margin:0}

.food-list{margin-top:10px}
.food-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line);
}
.food-row:last-child{border-bottom:none;padding-bottom:2px}
.food-nm{font-size:14.5px;font-weight:700;color:var(--tx)}
.food-am{font-size:12.5px;color:var(--mu);margin-top:2px}
.food-right{text-align:right;flex-shrink:0}
.food-stat{font-family:var(--font-disp);font-size:15.5px;font-weight:800;color:var(--brand-tx)}
.food-tag{font-size:12px;color:var(--mu)}

.spark{display:block;width:100%;height:68px;margin-top:10px;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
ol.clean{padding-left:18px;margin:10px 0 0;display:flex;flex-direction:column;gap:10px}
ol.clean li{font-size:14px;color:var(--tx2);line-height:1.55}
ol.clean b{color:var(--tx)}

/* ---- Docked Bottom Navigation (Solid Shell Footer) -------------- */
.bnav{
  flex-shrink:0;z-index:30;
  background:var(--surf);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.bnav-in{
  max-width:740px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px;
}
.tbtn{
  border:none;background:none;color:var(--mu);font:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 4px;border-radius:8px;cursor:pointer;
}
.tbtn svg{width:22px;height:22px;stroke-width:2}
.tbtn span{font-size:12px;font-weight:700}
.tbtn.on{color:var(--brand-tx);background:var(--brand-bg)}

/* ---- Floating Rest Timer & Toast (Only Elevated Overlays) ------- */
#rest{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:35;
  width:min(calc(100% - 28px),460px);
  display:none;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;border-radius:12px;
  background:var(--surf);border:1px solid var(--line2);
  box-shadow:0 12px 28px rgba(0,0,0,.38);
}
.rest-left{display:flex;align-items:center;gap:10px}
.rest-ring{position:relative;width:38px;height:38px;flex-shrink:0}
.rest-ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.rest-txt b{display:block;font-family:var(--font-disp);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.rest-txt span{font-size:12px;color:var(--mu);font-weight:600}
.rest-btns{display:flex;gap:6px}
.rest-btns button{
  padding:7px 10px;border-radius:6px;border:1px solid var(--line2);
  background:var(--surf2);color:var(--tx);font:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;
}
.rest-btns button.skip{background:var(--brand-btn);border-color:var(--brand-btn);color:#ffffff}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:45;
  background:var(--tx);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:700;
  display:none;box-shadow:0 10px 24px rgba(0,0,0,.30);white-space:nowrap;
  max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;
}
@media (max-width:380px){
  .brand-mark,.brand-sub{display:none}
  .brand-title{font-size:17px}
  .wk-badge{font-size:11.5px;padding:4px 7px}
  .cal-grid,.cal-dow{gap:3px}
  .card{padding:16px}
  .ex-head{padding:14px}
  .ex-body{padding:14px 14px 18px}
  .drawer-head{padding:14px 16px}
  .drawer-body{padding:0 16px 12px}
}
@media (max-height:480px) and (orientation:landscape){
  .topbar-in{height:46px}
  .brand-sub{display:none}
  .tbtn{flex-direction:row;gap:6px;padding:6px}
  .tbtn svg{width:18px;height:18px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="w topbar-in">
    <div class="brand-wrap">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
          <path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>
        </svg>
      </div>
      <div style="min-width:0">
        <h1 class="brand-title">Shred &amp; Recomp</h1>
        <div class="brand-sub" id="hdrSub">Beginner recomp · 60–75 min</div>
      </div>
    </div>
    <div class="top-actions">
      <span class="wk-badge" id="wkTag">B1 · Wk 1</span>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Switch theme" title="Switch light or dark theme">☀</button>
    </div>
  </div>
</header>

<div class="app-scroll" id="scroller">
  <main class="w" id="app"></main>
</div>

<div id="rest" role="status" aria-live="polite">
  <div class="rest-left">
    <div class="rest-ring">
      <svg viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--surf3)" stroke-width="3.2"/>
        <circle id="restArc" cx="18" cy="18" r="15" fill="none" stroke="var(--brand)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="0"/>
      </svg>
    </div>
    <div class="rest-txt">
      <b id="restT">2:00</b>
      <span>Rest Timer</span>
    </div>
  </div>
  <div class="rest-btns">
    <button onclick="adjRest(-15)">−15s</button>
    <button onclick="adjRest(15)">+15s</button>
    <button class="skip" onclick="skipRest()">Skip</button>
  </div>
</div>

<div id="toast" role="alert"></div>

<nav class="bnav" aria-label="Primary navigation">
  <div class="bnav-in" id="nav"></div>
</nav>

<script>
const $=id=>document.getElementById(id);
const ld=(k,f)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch(e){return f}};
const sv=()=>{try{localStorage.setItem('fp2',JSON.stringify(S))}catch(e){}};
function scrollTop(){const sc=$('scroller');if(sc)sc.scrollTo({top:0,behavior:'smooth'})}

// ---- State & Calendar Helpers -------------------------------------
const DEF_STATE={
  week:1, start:'', firstUse:'', mode:'beg', theme:'dark', diet:'std',
  bw:75, h:175, age:25, sex:'m', goal:500, bestStreak:0,
  notif:{on:false,time:'17:00',restNotif:true,lastFired:''},
  ach:{}, hist:{}, draft:{}, fin:{}, chk:{}, done:{}, skipped:{}, madeUp:{}, waist:[]
};
let S={...DEF_STATE, ...ld('fp2',{})};
S.hist=S.hist||{}; S.draft=S.draft||{}; S.fin=S.fin||{};
S.chk=S.chk||{}; S.done=S.done||{}; S.ach=S.ach||{};
S.skipped=S.skipped||{}; S.madeUp=S.madeUp||{};
S.notif={...DEF_STATE.notif, ...(S.notif||{})};
S.waist=Array.isArray(S.waist)?S.waist:[];
S.bw=+S.bw||75; S.h=+S.h||175; S.age=+S.age||25; S.bestStreak=+S.bestStreak||0;
S.sex=S.sex==='f'?'f':'m'; S.goal=+S.goal||500;
S.mode=S.mode==='pro'?'pro':'beg';
S.diet=S.diet==='tsom'?'tsom':'std';

function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fromIso(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function mon(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function ensure(){
  let ch=false;
  if(!S.start||isNaN(fromIso(S.start))){
    const m0=mon(new Date());
    m0.setDate(m0.getDate()-7*((S.week||1)-1));
    S.start=iso(m0); ch=true;
  }
  if(!S.firstUse||isNaN(fromIso(S.firstUse))){
    S.firstUse=Object.keys(S.done||{}).sort()[0]||iso(new Date());
    ch=true;
  }
  if(ch) sv();
}
ensure();
function trackStart(){return fromIso(S.firstUse||S.start)}
function dayNo(d){const a=fromIso(S.start),b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/864e5)+1}
function realWeek(d){return Math.max(1,Math.ceil(dayNo(d||new Date())/7))}

const DW=[0,'U1','L1','C','U2','L2','C']; // Sun..Sat
const _now=new Date();
let viewWeek=realWeek(), wk=DW[_now.getDay()]||'U1', tab='today', openId=null, visTab='anat';
let selDate=iso(_now), calY=_now.getFullYear(), calM=_now.getMonth(), makeupDate=null;
let wuOpen=false, cdOpen=false, confirmFin=false, quoteShift=0, newUnlock=null, lastTab='', dismissMiss='';
let figRaf=null, figPaused=false, figSlow=false;

function applyTheme(){
  const th=S.theme==='light'?'light':'dark';
  document.documentElement.setAttribute('data-theme',th);
  const c=th==='light'?'#f4f5f7':'#111316';
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.removeAttribute('media');m.setAttribute('content',c)});
  const b=$('themeBtn');
  if(b) b.textContent=th==='dark'?'☀':'☾';
}
function toggleTheme(){
  S.theme=S.theme==='light'?'dark':'light';
  sv(); applyTheme();
}
applyTheme();

// ---- Program Data (Exercises, Split, Long-Term Blocks) ------------
const e=(id,n,lo,hi,inc,rest,p,s,setup,move,bad,x={})=>({
  id,n,lo,hi,inc,rest,p,s,setup,move,bad,
  u:'reps',sets:4,bSets:3,tempo:'2-1-1',ph:['Lower Controlled','Drive Smoothly'],
  breath:'Inhale & brace core before lowering; exhale forcefully as you drive through the hardest part.',
  feel:`Steady tension across your ${p.join(' & ').toLowerCase()} with zero joint pinching.`,...x
});

const B={
  bp:e('bp','Barbell Bench Press',5,8,2.5,150,['Chest'],['Shoulders','Triceps'],
    'Lie with eyes under the bar, feet flat, shoulder blades pinched into the bench.',
    'Lower bar to mid-chest in 2–3 seconds, pause lightly, then press up and slightly back.',
    'Bouncing the bar off your chest or flaring elbows out to 90°.',
    {pose:'bp',eq:'bb',big:1,sets:5,bSets:3,tempo:'3-1-1',ph:['Lower to Chest','Press to Lockout'],
     breath:'Big inhale into your belly at the top, hold breath on the descent, exhale past the sticking point.',
     feel:'Deep stretch across your pecs at the bottom and strong chest squeeze as you press up.'}),
  br:e('br','Barbell Row',6,10,2.5,135,['Back'],['Biceps','Lower back'],
    'Hinge at the hips until torso is ~30° above floor with a flat, braced spine.',
    'Pull bar cleanly toward your belly button, squeezing shoulder blades for 1 second.',
    'Standing upright as you pull or jerking the bar with lower-back momentum.',
    {pose:'br',eq:'bb',big:1,sets:5,bSets:3,tempo:'2-1-2',ph:['Pull to Belly','Lower with Control'],
     breath:'Inhale & brace abs at the bottom; exhale as you pull the bar to your waist.',
     feel:'Mid-back and lats pulling elbows back—imagine your hands are just hooks.'}),
  oh:e('oh','Standing Overhead Press',6,10,2,135,['Shoulders'],['Triceps','Core'],
    'Bar resting on front delts, grip just outside shoulders, glutes and abs locked tight.',
    'Press straight overhead, moving head back slightly then through at lockout.',
    'Arching the lower back so the lift turns into an incline press.',
    {pose:'oh',eq:'bb',big:1,sets:4,bSets:3,tempo:'2-1-1',ph:['Press Overhead','Lower to Shoulders'],
     breath:'Take a braced belly breath at the collarbone, press overhead, exhale near lockout.',
     feel:'Front & side delts driving straight up while glutes and ribs stay locked down.'}),
  lp:e('lp','Lat Pulldown',8,12,2.5,90,['Back'],['Biceps'],
    'Grip slightly wider than shoulders, chest lifted, knees tucked snugly under the pad.',
    'Drive elbows down toward your back pockets until the bar reaches upper chest.',
    'Swinging your torso far back to yank the stack down.',
    {pose:'lp',eq:'cu',sets:4,bSets:3,tempo:'2-1-2',ph:['Pull Elbows Down','Control Return'],
     breath:'Inhale at the full overhead stretch; exhale steadily as elbows drive down.',
     feel:'Wide lats beneath your armpits lengthening at the top and cramping tight at chest level.'}),
  idb:e('idb','Incline Dumbbell Press',8,12,2,90,['Chest'],['Shoulders','Triceps'],
    'Set bench to 30°, plant feet, hold dumbbells over upper chest with elbows at ~45°.',
    'Lower dumbbells deep beside upper chest, then press up and slightly together.',
    'Setting bench too steep (45°+) so front shoulders take over.',
    {pose:'idb',eq:'db',sets:4,bSets:3,tempo:'3-1-1',ph:['Lower Deep','Press Up & In'],
     breath:'Inhale slowly as dumbbells lower to upper chest; exhale as you press up.',
     feel:'Upper chest fibers stretching wide at the bottom and flexing hard near the top.'}),
  cu:e('cu','Dumbbell Curl',8,12,1,75,['Biceps'],['Forearms'],
    'Stand tall with elbows pinned gently beside your ribs and palms facing forward.',
    'Curl weights up without moving elbows, squeeze at top, lower slowly for 3 seconds.',
    'Swinging hips or letting elbows drift forward to cheat reps.',
    {pose:'cu',eq:'db',sets:4,bSets:2,tempo:'2-1-3',ph:['Curl & Squeeze','Slow 3s Lower'],
     breath:'Exhale smoothly as you curl up; inhale during the slow 3-second lowering phase.',
     feel:'Tight peak contraction in the biceps with zero shoulder swing.'}),
  tp:e('tp','Triceps Pushdown',10,12,2.5,75,['Triceps'],[],
    'Stand tall at high cable, elbows tucked tight to your sides, slight forward lean.',
    'Extend forearms straight down to full lockout, pause 1 second, return with control.',
    'Letting elbows flare out or leaning bodyweight over the handle.',
    {pose:'tp',eq:'cu',sets:4,bSets:2,tempo:'2-1-2',ph:['Lock Out Down','Controlled Return'],
     breath:'Exhale as you lock out straight down; inhale on the controlled return.',
     feel:'Back of the upper arms burning at full lockout while shoulders stay completely still.'}),
  sq:e('sq','Barbell Back Squat',5,8,2.5,165,['Quads','Glutes'],['Hamstrings','Core'],
    'Rest bar across upper traps, feet shoulder-width with toes slightly out, brace core hard.',
    'Sit down between your hips to at least parallel, then drive through mid-foot to stand.',
    'Letting knees cave inward or heels peel off the floor.',
    {pose:'sq',eq:'bb-back',big:1,sets:5,bSets:3,tempo:'3-1-1',ph:['Descend to Parallel','Drive Up Strong'],
     breath:'Deep 360° belly inhale at the top, hold brace through the bottom, exhale as you stand up.',
     feel:'Even pressure across whole foot (tripod) with quads and glutes pushing the floor away.'}),
  rd:e('rd','Romanian Deadlift',6,10,2.5,135,['Hamstrings','Glutes'],['Lower back'],
    'Hold bar against thighs with soft knees, proud chest, and lats pulled tight.',
    'Push hips straight back as bar slides to mid-shin, then thrust hips forward to stand.',
    'Rounding the lower back or letting the bar drift away from your shins.',

const BLOCK=w=>{

const PH=n=>[

  {nm:'Peak',rir:0,pk:true,tip:'Hardest week: +1 set on big compounds. Stop at RIR 1 on barbell squats & bench without a spotter.'},
  {nm:'Deload',rir:4,deload:true,tip:'Half sets at ~90% load so joints and nervous system rebound stronger.'}
][(n-1)%4];

const nSets=(ex,w=viewWeek)=>{
  const p=PH(w), base=S.mode==='beg'?(ex.bSets||ex.sets):ex.sets;
  if(base===1) return 1;
  return p.deload?Math.max(1,Math.ceil(base/2)):base+(p.pk&&ex.big?1:0);
};
const key=(ex,w=viewWeek)=>`${w}|${wk}|${ex.id}`;

  let t=0;
  getEX(k).forEach(x=>{
    const work=x.u==='sec'?x.hi:x.u==='min'?x.hi*60:x.u==='rounds'?x.hi*120:45;
    t+=nSets(x,w)*(work+x.rest);
  });
  const m=Math.round(t/60)+(k==='C'?10:16);
  return m>=60?`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`:`${m} min`;
};
function workoutMuscles(k){
  const p=new Set(), s=new Set();
  getEX(k).forEach(ex=>{
    ex.p.forEach(m=>p.add(m));
    ex.s.forEach(m=>s.add(m));
  });
  return {p:[...p],s:[...s].filter(m=>!p.has(m))};
}

function lastWork(ex){const h=(S.hist[ex.id]||[]).filter(x=>!x.dl);return h.length?h[h.length-1]:null}
const RAT={bp:.4,br:.4,oh:.25,lp:.5,idb:.13,cu:.1,tp:.3,sq:.5,rd:.5,ss:.1,ht:.6,cf:.15,cr:.4,dbp:.15,oh2:.11,cu2:.09,sq2:.4,rd2:.2,ss2:.09,ht2:.5,cf2:.1,sk:.07};
function startW(ex){
  if(ex.bw) return 0;
  const st=ex.inc||2.5;
  let w=Math.round((RAT[ex.id]||.3)*(S.bw||75)/st)*st;
  if(ex.eq&&ex.eq.startsWith('bb')) w=Math.max(20,w);
  return Math.max(st,w);
}
function sug(ex,w=viewWeek){
  const ph=PH(w),l=lastWork(ex),n=nSets(ex,w),mid=Math.round((ex.lo+ex.hi)/2),st=ex.inc||2.5,fill=v=>Array(n).fill(v);
  if(!l) return {w:startW(ex),r:fill(ex.bw?ex.lo:mid),t:ex.bw?`Start at ${ex.lo} ${ex.u} per set.`:'Starting load scaled to your body weight—adjust if needed.'};
  const w0=Math.max(...l.sets.map(s=>s.w)),top=l.sets.every(s=>s.r>=ex.hi),low=l.sets.some(s=>s.r<ex.lo);
  const rs=i=>(l.sets[Math.min(i,l.sets.length-1)]||{r:ex.lo}).r;
  if(ph.deload) return {w:ex.bw?0:Math.max(st,Math.round(w0*.9/st)*st),r:fill(Math.min(ex.hi,mid)),t:'Deload week: lighter load and fewer sets to clear fatigue.'};
  if(top) return ex.bw
    ? {w:0,r:fill(ex.hi),t:`Hit ${ex.hi} ${ex.u} on all sets last time. Next step: ${ex.up}`}
    : {w:w0+ex.inc,r:fill(ex.lo),t:`Hit ${ex.hi} reps on all sets—weight bumps +${ex.inc} kg.`};
  if(low) return {w:w0,r:fill(ex.lo),t:`Some sets were under ${ex.lo} reps last time. Keep weight and rebuild.`};
  return {w:w0,r:Array.from({length:n},(_,i)=>Math.min(ex.hi,rs(i)+1)),t:'Same weight as last session—aim for +1 rep per set.'};
}
function tgtTxt(x,w=viewWeek){
  const g=sug(x,w), same=g.r.every(v=>v===g.r[0]);
  return `${g.r.length} × ${same?g.r[0]:g.r.join('/')}${x.u==='reps'?'':' '+x.u}${x.bw?'':' · '+g.w+' kg'+(x.eq==='db'?' ea':'')}`;
}
const lastTxt=ex=>{

  return l?'Last: '+l.sets.map(s=>ex.bw?s.r:`${s.w}×${s.r}`).join(' / '):'';
};

function calcStats(){
  const todayD=new Date(); todayD.setHours(0,0,0,0);
  const doneMap=S.done||{};
  // Smart training streak: counts consecutive scheduled days (Mon–Sat); Sunday rest doesn't break streak!
  let streak=0, cur=new Date(todayD);
  if(!doneMap[iso(cur)]) cur.setDate(cur.getDate()-1);
  for(let guard=0;guard<400;guard++){
    const k=iso(cur);
    if(doneMap[k]){
      streak++;
      cur.setDate(cur.getDate()-1);
    }else if(cur.getDay()===0){
      // Earned Sunday rest day preserves streak
      cur.setDate(cur.getDate()-1);
    }else{
      break;
    }
  }
  if(streak>S.bestStreak){S.bestStreak=streak;sv()}

  // Week sessions (Mon..Sun of current week)
  const m0=mon(todayD); let weekDone=0;
  for(let i=0;i<7;i++){const x=new Date(m0);x.setDate(m0.getDate()+i);if(doneMap[iso(x)])weekDone++}

  const totalSessions=Object.keys(doneMap).length;
  let totalVol=0, totalSets=0, totalPRs=0;
  Object.values(S.hist||{}).forEach(arr=>{
    let maxW=0;
    (arr||[]).forEach((entry,idx)=>{
      let entryMax=0;
      (entry.sets||[]).forEach(st=>{
        const w=+st.w||0, r=+st.r||0;
        totalSets++;
        if(w>0) totalVol+=w*r;
        if(w>entryMax) entryMax=w;
      });
      if(idx>0 && entryMax>maxW && maxW>0) totalPRs++;
      if(entryMax>maxW) maxW=entryMax;
    });
  });

  const wArr=S.waist||[], waistDrop=wArr.length>1?Math.max(0,wArr[0].v-wArr[wArr.length-1].v):0;
  return {streak,best:Math.max(streak,S.bestStreak),weekDone,totalSessions,totalVol:Math.round(totalVol),totalSets,totalPRs,waistCount:wArr.length,waistDrop};
}

// ---- Skipped / Missed Workout Detection & Bounce-Back Motivation --
function dayStatus(d){
  const ds=iso(d), todayD=new Date(); todayD.setHours(0,0,0,0);
  const target=new Date(d); target.setHours(0,0,0,0);
  const k=DW[target.getDay()];
  if(S.done[ds]) return 'done';
  if(S.madeUp[ds]) return 'madeup';
  if(S.skipped[ds]) return 'miss';
  if(!k) return 'rest';
  const startD=trackStart();
  if(target>=startD && target<todayD) return 'miss';
  if(ds===iso(todayD)) return 'today';
  return 'plan';
}

function getMissedRecent(lookbackDays=14){
  const todayD=new Date(); todayD.setHours(0,0,0,0);
  const startD=trackStart();
  const res=[];
  for(let i=0;i<=lookbackDays;i++){
    const d=new Date(todayD); d.setDate(todayD.getDate()-i);
    if(d<startD) break;
    const ds=iso(d), k=DW[d.getDay()];
    if(!k) continue;
    const isToday=(i===0);
    if(isToday){
      if(S.skipped[ds] && !S.done[ds]){
        res.push({ds,d,k,explicit:true,isToday:true});
      }
    }else if(!S.done[ds] && !S.madeUp[ds]){
      res.push({ds,d,k,explicit:!!S.skipped[ds],isToday:false});
    }
  }
  return res;
}

function missMotivation(list){
  const n=list.length;
  if(list[0] && list[0].isToday && n===1){
    return 'Taking a breather today is fine. Just do not let one skipped day turn into two. Hydrate, hit your protein, and return ready tomorrow.';
  }
  if(n===1){
    return 'You missed 1 recent workout. No guilt needed. Stick to one simple rule: never miss twice. Make up the lift or finish today’s session to keep momentum alive.';
  }
  if(n<=3){
    return `You missed ${n} workouts recently, which happens when life gets busy. Do not wait for Monday. One focused session today puts you straight back on track.`;
  }
  return `Welcome back. After ${n} missed sessions your muscles are rested and ready. Drop the weight 10% if needed, get one clean win today, and restart your streak.`;
}

function parseTempo(t){
  const m=String(t||'').match(/^(\d+)-(\d+)-(\d+)$/);
  if(m) return [['Lower',m[1]+'s'],['Pause',m[2]+'s'],['Lift',m[3]+'s']];
  if(t==='ISOMETRIC') return [['Brace','Tight'],['Hold','Steady'],['Breathe','Rhythmic']];
  if(t==='ZONE 2') return [['Incline','8–12%'],['Hands','Free'],['Pace','Steady']];
  if(t==='30s ON / 90s OFF') return [['Sprint','30s'],['Recover','90s'],['Effort','85–90%']];
  return [['Control','Smooth'],['Range','Full'],['Breath','Steady']];
}

function train(){
  const ph=PH(viewWeek), ty=wk[0]==='U'?'up':wk[0]==='L'?'lo':'cd', list=getEX(wk), curW=realWeek();
  const wuList=WU[ty], cdList=CD[ty];

  const cdDone=cdList.filter((_,i)=>S.chk[`${viewWeek}|${wk}|c${i}`]).length;

  const mobRows=(arr,pre)=>arr.map((item,i)=>{
    const k=`${viewWeek}|${wk}|${pre}${i}`, vid=`${pre}:${i}`, isOp=openId===vid, checked=!!S.chk[k];
    const resolved=item.ramp?{...item,n:`Ramp-Up: ${list[0].n}`,pose:list[0].pose,eq:list[0].eq,p:list[0].p,s:list[0].s}:item;
    return `<div class="mob-item">

  }).join('');

  const exCards=list.map((ex,xi)=>{
    const g=sug(ex), dr=S.draft[key(ex)]||[], n=nSets(ex), dn=dr.filter(s=>s&&s.d).length;
    const isOp=openId===ex.id, isDone=dn===n, nextEx=list[xi+1];
    const w0=(dr[0]&&dr[0].w!==''&&dr[0].w!=null)?dr[0].w:g.w;

    let body='';
    if(isOp){

  return `<div class="stack">

      <div class="row-between">

function calc(){
  const w=Math.max(35,+$('cw').value||75), h=Math.max(120,+$('ch').value||175), a=Math.max(14,+$('ca').value||25);
  const sex=$('cs').value, goal=+$('cg').value||500;
  S.bw=w;S.h=h;S.age=a;S.sex=sex;S.goal=goal;sv();
  const bmr=10*w+6.25*h-5*a+(sex==='m'?5:-161), mt=Math.round(bmr*(S.mode==='pro'?1.6:1.52));
  const t=Math.max(Math.round(bmr),mt-goal);
  const pFactor=S.diet==='tsom'?1.8:2.2;
  const p=Math.round(w*pFactor), f=Math.round(w*.78), c=Math.max(0,Math.round((t-p*4-f*9)/4));
  const totK=Math.max(1,p*4+c*4+f*9), pp=Math.round(p*4/totK*100), cp=Math.round(c*4/totK*100), fp=100-pp-cp;
  $('rk').textContent=t.toLocaleString()+' kcal'; $('rm').textContent='Maint ≈ '+mt.toLocaleString();
  $('rp').textContent=p+' g'; $('rpp').textContent=pp+'%';
  $('rc').textContent=c+' g'; $('rcp').textContent=cp+'%';
  $('rf').textContent=f+' g'; $('rfp').textContent=fp+'%';
  $('mbp').style.width=pp+'%'; $('mbc').style.width=cp+'%'; $('mbf').style.width=fp+'%';
  const mealBox=$('etMeals');
  if(mealBox){
    mealBox.innerHTML=buildEtMeals(t,p).map(m=>`<div class="meal-row">
      <div class="meal-top"><span class="meal-slot">${m.slot}</span><span class="meal-macro">${m.m}</span></div>
      <div class="meal-title">${m.t}</div>
      <p class="meal-desc">${m.d}</p>
    </div>`).join('');
  }
}

function commitFin(){
  let any=false;
  getEX(wk).forEach(ex=>{
    const k=key(ex), done=(S.draft[k]||[]).filter(s=>s&&s.d&&+s.r>0);
    if(done.length){
      any=true;
      const h=S.hist[ex.id]=S.hist[ex.id]||[];
      h.push({week:viewWeek,dl:!!PH(viewWeek).deload,sets:done.map(s=>({w:+s.w||0,r:+s.r}))});
      if(h.length>60) h.shift();
    }
    delete S.draft[k];
  });
  if(any){
    const todayStr=iso(new Date());
    S.fin[viewWeek]=(S.fin[viewWeek]||0)+1;
    S.done[todayStr]=wk;

    if(makeupDate && makeupDate!==todayStr){

      makeupDate=null;

  confirmFin=false; skipRest(); sv();
  const newly=any?checkAchievements(false):[];

function importData(inp){
