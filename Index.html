<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shred & Recomp Pro</title>
<meta name="application-name" content="Shred & Recomp Pro">
<meta name="apple-mobile-web-app-title" content="Shred Pro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317181a'/%3E%3Crect x='11' y='22' width='6' height='20' rx='3' fill='%2346c08a'/%3E%3Crect x='19' y='17' width='7' height='30' rx='3' fill='%23ffffff'/%3E%3Crect x='26' y='29' width='12' height='6' rx='2' fill='%23ffffff'/%3E%3Crect x='38' y='17' width='7' height='30' rx='3' fill='%23ffffff'/%3E%3Crect x='47' y='22' width='6' height='20' rx='3' fill='%2346c08a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f2;--card:#ffffff;--line:#dcdcd5;--tx:#17181a;--mu:#686a70;
  --ac:#17181a;--acx:#ffffff;--ok:#248a5d;--okbg:#e4f5ed;
  --p:#d33a40;--s:#d9772b;--pbg:#fbe7e7;--sbg:#faeadb;--hi:#eceae3;
  --warn:#b45309;--warnbg:#fef3c7;
  --stage1:#fbfbf9;--stage2:#efede6;--anat-body:#e4e2da;--anat-line:#b8b6ad;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1012;--card:#18191c;--line:#2b2d32;--tx:#ececee;--mu:#9a9ca3;
    --ac:#ececee;--acx:#0f1012;--ok:#46c08a;--okbg:#152e23;
    --p:#ef5a5f;--s:#f19a52;--pbg:#3a1b1d;--sbg:#3a2616;--hi:#222429;
    --warn:#fbbf24;--warnbg:#332811;
    --stage1:#1d1f24;--stage2:#131518;--anat-body:#2a2d35;--anat-line:#444854;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1012;--card:#18191c;--line:#2b2d32;--tx:#ececee;--mu:#9a9ca3;
  --ac:#ececee;--acx:#0f1012;--ok:#46c08a;--okbg:#152e23;
  --p:#ef5a5f;--s:#f19a52;--pbg:#3a1b1d;--sbg:#3a2616;--hi:#222429;
  --warn:#fbbf24;--warnbg:#332811;
  --stage1:#1d1f24;--stage2:#131518;--anat-body:#2a2d35;--anat-line:#444854;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.w{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 8px}
.top-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mu);font-size:12px}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;padding:0}
.icon-btn:active{transform:scale(.95)}

nav{display:flex;gap:5px;padding-bottom:10px}
nav button{flex:1;padding:9px 6px;border:1px solid var(--line);background:none;color:var(--mu);border-radius:9px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,color .15s}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}

main{padding:16px 0 104px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
.card.done{border-color:var(--ok)}
.bar{height:7px;background:var(--hi);border-radius:4px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s ease}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.seg button{flex:1 1 28%;padding:10px 8px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;font-size:12.5px;cursor:pointer}
.seg button.on{border-color:var(--ac);box-shadow:inset 0 0 0 1.2px var(--ac);background:var(--hi)}

.pill-sw{display:inline-flex;background:var(--hi);padding:3px;border-radius:10px;gap:3px;width:100%;margin-top:8px}
.pill-sw button{flex:1;border:none;background:none;color:var(--mu);padding:8px 10px;border-radius:8px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.pill-sw button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.btn{padding:11px 14px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:var(--acx);font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.85}
.btn.g{background:none;color:var(--tx);border-color:var(--line)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:7px 11px;font-size:12.5px}

.hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
h2{font-size:16px;margin:0;letter-spacing:-.01em}
.mu{color:var(--mu);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.c{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
.c.p{background:var(--pbg);color:var(--p)}
.c.s{background:var(--sbg);color:var(--s)}
.c.o{background:var(--okbg);color:var(--ok)}
.sug{background:var(--hi);border-radius:10px;padding:10px 12px;margin:8px 0 10px}
.sug .tg{font-size:16.5px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}

.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.sn{width:22px;color:var(--mu);font-size:13px;font-weight:600;text-align:center}
input[type=number],select{width:82px;padding:10px 8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;font-weight:600;text-align:center}
select{width:100%;text-align:left;font-weight:500}
input[type=number]:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
.u{font-size:12px;color:var(--mu);min-width:26px}
.ck{margin-left:auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:#fff;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0}
.ck.on{background:var(--ok);border-color:var(--ok)}

.fg{background:var(--hi);border-radius:14px;padding:12px;margin-top:10px}
.vis-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
@media (min-width:580px){.vis-grid{grid-template-columns:1.25fr 1fr;align-items:stretch}}
.vis-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.vis-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.vis-ttl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.phase-pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--hi);color:var(--tx);display:inline-flex;align-items:center;gap:5px}
.phase-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.fig-wrap{position:relative;cursor:pointer;user-select:none;background:radial-gradient(circle at 50% 35%,var(--stage1),var(--stage2));border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;display:flex;align-items:center;justify-content:center;min-height:216px}
#fig{width:100%}
#fig svg{display:block;width:100%;max-width:380px;height:218px;margin:0 auto}
.vis-ctrl{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.vis-ctrl .grp{display:flex;gap:5px}
.vis-btn{padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.vis-btn.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.vis-mini{padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--mu);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;flex-shrink:0}
.vis-mini.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.anat-box{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,var(--stage1),var(--stage2));border:1px solid var(--line);border-radius:10px;padding:6px 4px;min-height:216px}
#anat{width:100%}
#anat svg{display:block;width:100%;max-width:290px;height:218px;margin:0 auto}
.anat-leg{display:flex;justify-content:center;gap:12px;margin-top:8px;font-size:11.5px;color:var(--mu);font-weight:500}
.steps{display:grid;gap:6px;margin-top:8px}
.step{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;line-height:1.45}
.step b{display:inline-block;margin-right:4px}
.step.bad{border-color:var(--p);background:var(--pbg);color:var(--p)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
tr.cur td{background:var(--hi);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.k{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.k div{background:var(--hi);border-radius:10px;padding:11px}
.k b{display:block;font-size:20px;margin-top:2px}
.mbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:10px;gap:2px}
.mbar span{display:block;height:100%;transition:width .25s}

.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.f label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px;font-weight:500}
.f input{width:100%}
ol{padding-left:18px;margin:8px 0}
li{margin:6px 0;font-size:14px}

.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.wk7 div{text-align:center;padding:7px 2px;border:1px solid var(--line);border-radius:9px;font-size:11px;line-height:1.3}
.wk7 b{display:block;font-size:14px}
.wk7 .t{border-color:var(--ac);box-shadow:inset 0 0 0 1.2px var(--ac)}
.wk7 .d{background:var(--ok);border-color:var(--ok);color:#fff}

.li{margin:4px 0;font-size:13.5px}
.ci-item{border-bottom:1px solid var(--line);padding:4px 0}
.ci-item:last-child{border-bottom:none}
.ci-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ci{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer;flex:1}
.ci input{margin-top:3px;width:19px;height:19px;accent-color:var(--ok);flex-shrink:0}
.th{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 0}
.tc{width:82px;text-align:center}
.tg{font-size:18px;font-weight:700;margin:4px 0 3px;letter-spacing:-.01em}
.cnt{font-size:12px;color:var(--mu);font-weight:600}
.notice{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600;margin-top:10px}
.confirm-box{background:var(--hi);border:1px solid var(--ac);border-radius:12px;padding:14px;margin-top:10px}
.confirm-box p{margin:0 0 10px;font-size:14px;font-weight:600}
.confirm-actions{display:flex;gap:8px}
.spark{width:100%;height:56px;margin-top:8px;display:block}
.blk-list{display:grid;gap:8px;margin-top:10px}
.blk-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.blk-item.cur{border-color:var(--ok);background:var(--okbg)}
.bk-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bk-row .btn{flex:1 1 130px}

#rest{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ac);color:var(--acx);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:center;gap:8px;font-weight:600;box-shadow:0 -4px 16px rgba(0,0,0,.18)}
#rest .r-acts{display:flex;gap:6px;align-items:center}
#rest button{background:none;border:1px solid var(--acx);color:var(--acx);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--ac);color:var(--acx);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:40;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 20px rgba(0,0,0,.22)}
</style>
</head>
<body>
<header><div class="w">
  <div class="top">
    <div>
      <h1>Shred &amp; Recomp Pro</h1>
      <div class="sub" id="hdrSub">Long-term progressive overload &amp; fat-loss tracker</div>
    </div>
    <div class="top-r">
      <div class="sub" id="wkTag"></div>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Switch light / dark theme">◐</button>
    </div>
  </div>
  <nav id="nav"></nav>
</div></header>

<main class="w" id="app"></main>

<div id="rest">
  <span id="restT">Rest 0:00</span>
  <div class="r-acts">
    <button onclick="adjRest(-15)">−15s</button>
    <button onclick="adjRest(15)">+15s</button>
    <button onclick="skipRest()">Skip</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const ld=(k,f)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch(e){return f}};
const sv=()=>{try{localStorage.setItem('fp3',JSON.stringify(S))}catch(e){}};

// Migrate seamlessly from earlier fp2 data if present
const prev = ld('fp2', null);
let S = ld('fp3', prev ? {
  ...prev,
  mode: prev.mode || 'beg',
  h: prev.h || 175,
  age: prev.age || 25,
  sex: prev.sex || 'm',
  goal: prev.goal || 500,
  theme: prev.theme || ''
} : {
  week: 1, mode: 'beg', hist: {}, draft: {}, fin: {}, chk: {}, done: {},
  bw: 75, h: 175, age: 25, sex: 'm', goal: 500, waist: [], theme: ''
});
S.chk = S.chk || {}; S.done = S.done || {}; S.hist = S.hist || {}; S.draft = S.draft || {}; S.fin = S.fin || {};
S.bw = S.bw || 75; S.h = S.h || 175; S.age = S.age || 25; S.sex = S.sex || 'm'; S.goal = S.goal || 500;
S.mode = S.mode || 'beg'; S.waist = S.waist || [];

// Calendar & Week state (separate browse week from calendar week so Today doesn't overwrite browsing)
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function mon(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
if(!S.start){const m=mon(new Date());m.setDate(m.getDate()-7*((S.week||1)-1));S.start=iso(m);sv()}
function dayNo(d){const a=new Date(S.start+'T00:00:00'),b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/864e5)+1}
function realWeek(d){return Math.max(1,Math.ceil(dayNo(d||new Date())/7))}

let viewWeek = realWeek();
let wk = 'U1', tab = 'today', openId = 'bp';
let confirmFin = false, figPaused = false, figSlow = false, figRaf = null;

// Theme initialization
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute('data-theme', S.theme);
  else document.documentElement.removeAttribute('data-theme');
  const isDark = S.theme === 'dark' || (!S.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches);
  const b = $('themeBtn');
  if(b) b.textContent = isDark ? '☀' : '☾';
}
function toggleTheme(){
  const isDark = S.theme === 'dark' || (!S.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches);
  S.theme = isDark ? 'light' : 'dark';
  sv(); applyTheme();
}
applyTheme();

// ---- Program Data (Clear Setup / Move / Avoid instructions) -------
const e=(id,n,lo,hi,inc,rest,p,s,setup,move,bad,x={})=>({
  id,n,lo,hi,inc,rest,p,s,setup,move,bad,u:'reps',sets:4,begSets:3,...x
});

const B={
bp:e('bp','Barbell Bench Press',5,8,2.5,150,['Chest'],['Shoulders','Triceps'],
  'Eyes under the bar, feet planted flat, shoulder blades pinched down and back.',
  'Lower to mid-chest over 2 s with elbows ~45° tucked, then press up and slightly back.',
  'Bouncing the bar off your chest or flaring elbows straight out to 90°.',
  {pose:'bp',eq:'bb',big:1,sets:5,begSets:3,tempo:'2-1-1',ph:['Lower to Chest','Press Up']}),
br:e('br','Barbell Row',6,10,2.5,120,['Back'],['Biceps','Lower back'],
  'Hinge at the hips until torso is ~30° above the floor with a braced, flat back.',
  'Pull the bar to your lower ribs/navel, elbows passing torso, squeeze 1 s, lower under control.',
  'Standing upright as you pull or yanking the weight with lower-back momentum.',
  {pose:'br',eq:'bb',big:1,sets:5,begSets:3,tempo:'2-1-1',ph:['Row to Ribs','Lower Slowly']}),
oh:e('oh','Standing Overhead Press',6,10,2,120,['Shoulders'],['Triceps','Core'],
  'Grip just outside shoulders, squeeze glutes and brace abs hard.',
  'Press straight up, moving head slightly back then through at lockout over mid-foot.',
  'Arching your lower back so it turns into an incline press.',
  {pose:'oh',eq:'bb',big:1,sets:4,begSets:3,tempo:'2-0-1',ph:['Press Overhead','Lower to Collar']}),
lp:e('lp','Lat Pulldown',8,12,2.5,90,['Back'],['Biceps'],
  'Grip slightly wider than shoulders, thighs locked under pad, slight torso lean back.',
  'Drive elbows down toward your back pockets until the bar reaches upper chest; return slowly.',
  'Swinging backward to yank the stack down.',
  {pose:'lp',eq:'cu',sets:4,begSets:3,tempo:'2-1-1',ph:['Pull Elbows Down','Control Up']}),
idb:e('idb','Incline Dumbbell Press',8,12,2,90,['Chest'],['Shoulders','Triceps'],
  'Set bench to 30–45°, feet planted, dumbbells held above upper chest.',
  'Lower to upper chest with elbows at ~45°, then press smoothly up and slightly inward.',
  'Setting the bench too steep (60°+) so shoulders take over.',
  {pose:'idb',eq:'db',sets:4,begSets:2,tempo:'2-1-1',ph:['Press Up','Lower Slowly']}),
cu:e('cu','Dumbbell Curl',8,12,1,75,['Biceps'],['Forearms'],
  'Stand tall with elbows pinned gently to your ribs, palms facing forward.',
  'Curl up to full squeeze at the top, then lower slowly for 3 seconds.',
  'Swinging hips or elbows forward to cheat the weight up.',
  {pose:'cu',eq:'db',sets:4,begSets:2,tempo:'3-1-1',ph:['Curl & Squeeze','Lower 3s']}),
tp:e('tp','Triceps Pushdown',10,12,2.5,75,['Triceps'],[],
  'Stand close to the cable with elbows glued to your sides and slight forward lean.',
  'Push handle down to full arm lockout, pause 1 s, and return slowly without elbows drifting.',
  'Leaning over the stack or letting elbows flare forward.',
  {pose:'tp',eq:'cu',sets:4,begSets:2,tempo:'2-1-1',ph:['Extend & Lock','Return Slowly']}),
sq:e('sq','Barbell Back Squat',5,8,2.5,150,['Quads','Glutes'],['Hamstrings','Core'],
  'Bar across upper back, feet shoulder-width, toes slightly out, deep belly brace.',
  'Sit down between your hips to at least parallel, then drive through mid-foot to stand.',
  'Letting knees cave inward or heels peel off the floor.',
  {pose:'sq',eq:'bb-back',big:1,sets:5,begSets:3,tempo:'3-0-1',ph:['Squat Down','Drive Up']}),
rd:e('rd','Romanian Deadlift',6,10,2.5,120,['Hamstrings','Glutes'],['Lower back'],
  'Stand tall holding bar against thighs with a soft, fixed bend in your knees.',
  'Push hips straight back while sliding bar down legs to mid-shin, then thrust hips forward.',

// Long-term multi-block roadmap (52-week progression & ongoing mastery)
const BLOCKS=[
  {nm:'Foundation & Fat Loss',sub:'Lock in clean lifting form, daily steps, and steady belly-fat loss.',tag:'Weeks 1–12'},
  {nm:'Lean Muscle & Strength',sub:'Drive progressive overload across all lifts while staying lean.',tag:'Weeks 13–24'},

  {nm:'Peak Physique & Mastery',sub:'Consolidate strength, stamina, and sustainable low body fat.',tag:'Weeks 37–48'}
];
const BLOCK=w=>{
  const wkNum=Math.max(1,w);
  const num=Math.floor((wkNum-1)/12)+1;
  const start=(num-1)*12+1, end=start+11;
  const info=BLOCKS[(num-1)%BLOCKS.length];
  return {num,start,end,wkInBlk:((wkNum-1)%12)+1,...info};
};

const nSets=(ex,w=viewWeek)=>{
  const p=PH(w), base=S.mode==='beg'?(ex.begSets??Math.min(3,ex.sets)):ex.sets;
  if(ex.sets===1) return 1;
  return p.deload ? Math.max(1,Math.ceil(base/2)) : base + (p.pk && ex.big ? 1 : 0);
};
const key=(ex,w=viewWeek)=>`${w}|${wk}|${ex.id}`;
const est=(k,w=viewWeek)=>{
  let t=0;
  getEX(k).forEach(x=>{
    const work=x.u==='sec'?x.hi:x.u==='min'?x.hi*60:x.u==='rounds'?x.hi*120:45;
    t+=nSets(x,w)*(work+x.rest);
  });
  const pad=S.mode==='beg'?15:22;
  const m=Math.round(t/60)+pad;
  return m>=60?Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m':m+' min';
};

let figPhase=0, figLastTs=0;
function stopFig(){if(figRaf){cancelAnimationFrame(figRaf);figRaf=null}}
function getOpenItem(){
  if(tab!=='train'||!openId) return null;
  const ty=wk[0]==='U'?'up':wk[0]==='L'?'lo':'cd';
  if(openId.startsWith('w:')||openId.startsWith('c:')){
    const isW=openId.startsWith('w:'), idx=+openId.slice(2);
    const item=(isW?WU[ty]:CD[ty])[idx];
    if(!item) return null;
    if(item.ramp){
      const first=getEX(wk)[0];
      return {...item, n:`Ramp-Up: ${first.n}`, pose:first.pose, eq:first.eq, p:first.p, s:first.s};
    }
    return item;
  }
  return getEX(wk).find(x=>x.id===openId)||null;
}
function toggleVis(id){
  openId = openId===id ? null : id;
  figPaused = false;
  render();
}
function startFig(){
  stopFig();
  const ex=getOpenItem();
  if(!ex||!ex.pose) return;
  const anatEl=$('anat');
  if(anatEl) anatEl.innerHTML=anatSvg(ex);
  const baseSpeed = ex.pose==='sr' ? 1150
    : (ex.pose==='iw'||ex.pose==='walk'||ex.pose==='lsw') ? 1750
    : ex.pose==='armc' ? 2200
    : ex.pose==='breath' ? 5000
    : (['dchest','latst','trist','hipf','hamst','fig4','calfst'].includes(ex.pose)) ? 3800
    : 3200;
  figLastTs = performance.now();
  const draw = ts => {
    const el=$('fig');
    if(!el){stopFig();return}
    const speed = figSlow ? baseSpeed * 2 : baseSpeed;
    if(!figPaused){
      const dt = Math.min(100, ts - figLastTs);
      figPhase = (figPhase + dt / speed) % 1;
    }
    figLastTs = ts;
    const t = (1 - Math.cos(figPhase * 2 * Math.PI)) / 2;
    el.innerHTML = fig(ex, t, figPhase);

    // Sync live phase indicator label & subtle muscle contraction pulse
    const phEl=$('figPhase');
    if(phEl&&ex.ph){
      const idx = figPhase < 0.5 ? 0 : 1;
      phEl.textContent = ex.ph[idx];
    }
    if(anatEl){
      const op = (0.72 + 0.28 * t).toFixed(2);
      anatEl.querySelectorAll('.m-pri').forEach(node=>{node.style.opacity=op});
    }
    figRaf = requestAnimationFrame(draw);
  };
  figRaf = requestAnimationFrame(draw);
}
function toggleFigPause(){
  figPaused = !figPaused;
  const b=$('btnPlay'); if(b) b.textContent = figPaused ? '▶ Resume' : '❚❚ Pause';
}
function toggleFigSlow(){
  figSlow = !figSlow;
  const b=$('btnSlow');
  if(b){b.classList.toggle('on',figSlow); b.textContent = figSlow ? '0.5× Slow-Mo On' : '0.5× Slow-Mo';}
}

// ---- Double Progression Engine ------------------------------------
function lastWork(ex){const h=(S.hist[ex.id]||[]).filter(x=>!x.dl);return h.length?h[h.length-1]:null}
const RAT={bp:.4,br:.4,oh:.25,lp:.5,idb:.13,cu:.1,tp:.3,sq:.5,rd:.5,ss:.1,ht:.6,cf:.15,cr:.4,dbp:.15,oh2:.11,cu2:.09,sq2:.4,rd2:.2,ss2:.09,ht2:.5,cf2:.1,sk:.07};
function startW(ex){
  if(ex.bw) return 0;
  const st=ex.inc||2.5;
  let w=Math.round((RAT[ex.id]||.3)*(S.bw||75)/st)*st;
  if(ex.eq && ex.eq.startsWith('bb')) w=Math.max(20,w);
  return Math.max(st,w);
}
function sug(ex,w=viewWeek){
  const ph=PH(w),l=lastWork(ex),n=nSets(ex,w),mid=Math.round((ex.lo+ex.hi)/2),st=ex.inc||2.5,fill=v=>Array(n).fill(v);
  if(!l) return {w:startW(ex),r:fill(ex.bw?ex.lo:mid),t:ex.bw?`First session: start at ${ex.lo} ${ex.u} per set.`:'First session: starting weight scaled to your body weight—adjust if too light or heavy.'};
  const w0=Math.max(...l.sets.map(s=>s.w)),top=l.sets.every(s=>s.r>=ex.hi),low=l.sets.some(s=>s.r<ex.lo);
  const rs=i=>(l.sets[Math.min(i,l.sets.length-1)]||{r:ex.lo}).r;
  if(ph.deload) return {w:ex.bw?0:Math.max(st,Math.round(w0*.9/st)*st),r:fill(Math.min(ex.hi,mid)),t:'Deload week: lighter load and fewer sets to clear fatigue.'};
  if(top) return ex.bw
    ? {w:0,r:fill(ex.hi),t:`Hit ${ex.hi} ${ex.u} on every set last time. Progress: ${ex.up}`}
    : {w:w0+ex.inc,r:fill(ex.lo),t:`Hit ${ex.hi} reps on all sets last time—weight increases by +${ex.inc} kg.`};
  if(low) return {w:w0,r:fill(ex.lo),t:`Some sets were under ${ex.lo} reps last time. Keep weight, rest fully, rebuild reps.`};
  return {w:w0,r:Array.from({length:n},(_,i)=>Math.min(ex.hi,rs(i)+1)),t:'Same weight as last session—aim for +1 rep per set.'};
}
function tgtTxt(x,w=viewWeek){
  const g=sug(x,w),same=g.r.every(v=>v===g.r[0]);
  return `${g.r.length} × ${same?g.r[0]:g.r.join('/')}${x.u==='reps'?'':' '+x.u}${x.bw?'':' @ '+g.w+' kg'+(x.eq==='db'?' each':'')}`;
}
const lastTxt=ex=>{
  const l=lastWork(ex);
  return l?'Last: '+l.sets.map(s=>ex.bw?s.r:`${s.w}×${s.r}`).join(' · ')+(ex.bw?' '+ex.u:' kg×reps'):'';
};

function train(){
  const ph=PH(viewWeek), ty=wk[0]==='U'?'up':wk[0]==='L'?'lo':'cd', list=getEX(wk), curW=realWeek();
  const ck=(a,pre)=>a.map((item,i)=>{
    const k=`${viewWeek}|${wk}|${pre}${i}`, vid=`${pre}:${i}`, isOp=openId===vid;
    const resolved = item.ramp
      ? {...item, n:`Ramp-Up: ${list[0].n}`, pose:list[0].pose, eq:list[0].eq, p:list[0].p, s:list[0].s}
      : item;
    return `<div class="ci-item">
      <div class="ci-row">
        <label class="ci"><input type="checkbox" ${S.chk[k]?'checked':''} onchange="S.chk['${k}']=this.checked;sv()"><span>${item.t}</span></label>
        <button class="vis-mini ${isOp?'on':''}" onclick="toggleVis('${vid}')">${isOp?'Hide':'Demo'}</button>
      </div>
      ${isOp?renderVisualPanel(resolved,true):''}
    </div>`;
  }).join('');

  let h=`<div class="seg">${['U1','L1','C','U2','L2'].map(k=>`<button class="${wk===k?'on':''}" onclick="go('${k}')">${LONG[k]}</button>`).join('')}</div>
  <div class="card">
    <div class="hd"><h2>${NAMES[wk]}</h2><span class="mu">≈ ${est(wk)} total</span></div>
    <p class="mu" style="margin:6px 0 0">Week ${viewWeek} · ${ph.nm} · leave ~${ph.rir} rep${ph.rir===1?'':'s'} in reserve. ${viewWeek===1?'Focus on crisp form over heavy ego weight. ':''}${ph.tip}</p>
    <div class="row" style="margin-top:10px">
      <button class="btn g sm" onclick="wkStep(-1)">‹ Wk</button>
      <button class="btn g sm" onclick="wkStep(1)">Wk ›</button>
      ${viewWeek!==curW?`<button class="btn g sm" onclick="viewWeek=${curW};render()">Current (Wk ${curW})</button>`:''}

    </div>
    <div class="bar"><i id="pb"></i></div>

  <div class="card"><div class="hd"><h2>1 · Warm-up</h2><span class="mu">Tap Demo to preview</span></div><div style="margin-top:6px">${ck(WU[ty],'w')}</div></div>
  <h2 style="margin:16px 0 8px">2 · Main Work</h2>`;

  list.forEach((ex,xi)=>{
    const g=sug(ex), dr=S.draft[key(ex)]||[], n=nSets(ex), dn=dr.filter(s=>s&&s.d).length, op=openId===ex.id;
    const w0=(dr[0]&&dr[0].w!==''&&dr[0].w!=null)?dr[0].w:g.w;
    let rows=`<div class="row th"><span class="sn">#</span>${ex.bw?'':'<span class="tc">Weight</span><span class="u"></span>'}<span class="tc">${ex.u==='reps'?'Reps':ex.u==='sec'?'Seconds':ex.u==='min'?'Minutes':'Rounds'}</span><span class="u"></span></div>`;
    for(let i=0;i<n;i++){
      const s=dr[i]||{}, wv=(s.w!==undefined&&s.w!=='')?s.w:w0, rv=(s.r!==undefined&&s.r!=='')?s.r:(g.r[i]??ex.lo);
      rows+=`<div class="row">
        <span class="sn">${i+1}</span>
        ${ex.bw?'':`<input type="number" inputmode="decimal" step="any" data-w="${ex.id}-${i}" value="${wv}" oninput="inpW('${ex.id}',${i},this.value)"><span class="u">kg</span>`}
        <input type="number" inputmode="numeric" value="${rv}" oninput="inpR('${ex.id}',${i},this.value)">
        <span class="u">${ex.u==='reps'?'':ex.u}</span>
        <button class="ck ${s.d?'on':''}" onclick="chk('${ex.id}',${i})" aria-label="Mark set ${i+1} complete">${s.d?'✓':''}</button>
      </div>`;
    }
    h+=`<div class="card ${dn===n?'done':''}">
      <div class="hd">
        <div class="cnt">${String(xi+1).padStart(2,'0')} / ${String(list.length).padStart(2,'0')}${dn===n?' · ✓ Complete':''}</div>
        ${ex.rest?`<span class="c o">Rest ${Math.floor(ex.rest/60)}:${String(ex.rest%60).padStart(2,'0')}</span>`:''}
      </div>
      <h2 style="margin-top:4px">${ex.n}</h2>
      <div class="chips">${chips(ex)}</div>
      <div class="sug">
        <div class="tg">Target: ${tgtTxt(ex)}</div>
        <div class="mu">${g.t}${lastTxt(ex)?' · '+lastTxt(ex):''}</div>
      </div>
      ${rows}
      <button class="btn g sm" style="margin-top:10px" onclick="toggleVis('${ex.id}')">${op?'Hide form visual ▴':'Form visual & steps ▾'}</button>
      ${op?renderVisualPanel(ex,false):''}
    </div>`;
  });

  // Safe inline two-step finish confirmation (no browser confirm/alert)
  const totals = countProgress();
  const finishUI = confirmFin
    ? `<div class="confirm-box">
        <p>Save ${totals.done} of ${totals.total} sets for ${NAMES[wk]} and update next session targets?</p>
        ${totals.done < totals.total ? `<div class="mu" style="margin-bottom:10px">Unchecked sets will be skipped.</div>` : ''}
        <div class="confirm-actions">
          <button class="btn ok full" onclick="commitFin()">Confirm &amp; Save</button>
          <button class="btn g" onclick="confirmFin=false;render()">Cancel</button>
        </div>
      </div>`
    : `<button class="btn full" onclick="askFin()">Finish session &amp; save</button>`;

  return h+`<div class="card"><div class="hd"><h2>3 · Cool-down</h2><span class="mu">Tap Demo to preview</span></div><div style="margin-top:6px">${ck(CD[ty],'c')}</div>
    <p class="mu" style="margin:8px 0 0">Within 2 hours: eat 30–40 g protein + carbs, drink water, and prioritize 7.5+ hours of sleep.</p></div>
    ${finishUI}
    <p class="mu" style="margin-top:10px"><span class="dot" style="background:var(--p)"></span>Primary muscle &nbsp; <span class="dot" style="background:var(--s)"></span>Secondary muscle</p>`;
}

function addWaist(){
  const v=parseFloat($('wv').value);
  if(!v||v<40||v>200){toast('Enter a valid waist measurement in cm.');return}
  S.waist.push({d:iso(new Date()),v:Math.round(v*10)/10});
  sv(); render(); toast('Waist measurement saved.');
}
function delWaist(){
  if(!S.waist.length) return;
  S.waist.pop(); sv(); render(); toast('Removed last entry.');
}
function waistSpark(w){
  if(w.length<2) return '';
  const pts=w.slice(-10), vals=pts.map(x=>x.v);
  const mn=Math.min(...vals)-0.5, mx=Math.max(...vals)+0.5, rng=mx-mn||1;
  const coords=pts.map((p,i)=>[10+(i/(pts.length-1))*280, 46-((p.v-mn)/rng)*36]);
  const poly=coords.map(c=>c.map(n=>Math.round(n*10)/10).join(',')).join(' ');
  const dots=coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="3" fill="var(--ok)"/>`).join('');
  return `<svg class="spark" viewBox="0 0 300 54" aria-label="Waist trend chart"><polyline fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>${dots}</svg>`;
}

function calc(){
  const w=Math.max(35,+$('cw').value||75), h=Math.max(120,+$('ch').value||175), a=Math.max(14,+$('ca').value||25);
  const sex=$('cs').value, goal=+$('cg').value||500;
  S.bw=w; S.h=h; S.age=a; S.sex=sex; S.goal=goal; sv();

  const bmr=10*w+6.25*h-5*a+(sex==='m'?5:-161);
  const mt=Math.round(bmr*(S.mode==='pro'?1.6:1.52));
  const t=Math.max(Math.round(bmr),mt-goal);
  const p=Math.round(w*2.2), f=Math.round(w*0.8), c=Math.max(0,Math.round((t-p*4-f*9)/4));
  const totK=Math.max(1,p*4+c*4+f*9);
  const pp=Math.round(p*4/totK*100), cp=Math.round(c*4/totK*100), fp=100-pp-cp;

  $('rk').textContent=t.toLocaleString()+' kcal';
  $('rm').textContent='Maint ≈ '+mt.toLocaleString();
  $('rp').textContent=p+' g'; $('rpp').textContent=pp+'% of cals';
  $('rc').textContent=c+' g'; $('rcp').textContent=cp+'% of cals';
  $('rf').textContent=f+' g'; $('rfp').textContent=fp+'% of cals';
  $('mbp').style.width=pp+'%'; $('mbc').style.width=cp+'%'; $('mbf').style.width=fp+'%';
}

// ---- Backup Export / Import (Device-Safe) -------------------------
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`shred-recomp-backup-${iso(new Date())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Backup file downloaded.');
  }catch(e){toast('Could not download file—try Copy Backup Text.')}
}
function copyData(){
  try{
    const ta=document.createElement('textarea');
    ta.value=JSON.stringify(S);
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy');
    ta.remove();
    toast(ok?'Backup text copied to clipboard!':'Could not copy—use Download Backup.');
  }catch(e){toast('Could not copy backup text.')}
}
function triggerImport(){
  const inp=$('impFile'); if(inp){inp.value=''; inp.click();}
}
function importData(input){
  const file=input.files&&input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||typeof data!=='object'||!data.hist) throw new Error('Invalid');
      S={
        week:1, mode:'beg', hist:{}, draft:{}, fin:{}, chk:{}, done:{},
        bw:75, h:175, age:25, sex:'m', goal:500, waist:[], theme:'',
        ...data
      };
      if(!S.start) S.start=iso(mon(new Date()));
      sv(); applyTheme(); viewWeek=realWeek(); render();
      toast('Backup restored! All logs & settings loaded.');
    }catch(e){toast('Invalid backup file—please select a Shred Pro .json file.')}
  };
  reader.readAsText(file);
}

function inpW(id,i,v){
  const ex=getEX(wk).find(x=>x.id===id), k=key(ex);
  S.draft[k]=S.draft[k]||[]; S.draft[k][i]=S.draft[k][i]||{};
  S.draft[k][i].w = v==='' ? '' : +v;
  if(i>0) S.draft[k][i].manualW = true;
  // Smoothly mirror Set 1 weight into subsequent unedited sets without rebuilding DOM
  if(i===0){
    const n=nSets(ex), fallback=v===''?sug(ex).w:v;
    for(let j=1;j<n;j++){
      const sj=S.draft[k][j];
      if(!sj||(!sj.d&&!sj.manualW)){
        const el=document.querySelector(`input[data-w="${id}-${j}"]`);
        if(el) el.value = fallback;
      }
    }
  }
  sv();
}
function inpR(id,i,v){
  const ex=getEX(wk).find(x=>x.id===id), k=key(ex);
  S.draft[k]=S.draft[k]||[]; S.draft[k][i]=S.draft[k][i]||{};
  S.draft[k][i].r = v==='' ? '' : +v;
  sv();
}
function chk(id,i){
  const ex=getEX(wk).find(x=>x.id===id), k=key(ex);
  S.draft[k]=S.draft[k]||[];
  const d=S.draft[k], g=sug(ex), s=d[i]=d[i]||{};
  s.d = !s.d;
  if(s.d){
    const w0=(d[0]&&d[0].w!==''&&d[0].w!=null)?d[0].w:g.w;
    if(!ex.bw&&(s.w===''||s.w==null)) s.w=w0;
    if(s.r===''||s.r==null) s.r=g.r[i]??ex.lo;
    if(ex.rest) rest(ex.rest);
  }
  sv(); render();
}
function countProgress(){
  let total=0, done=0;
  getEX(wk).forEach(ex=>{
    total+=nSets(ex);
    done+=(S.draft[key(ex)]||[]).filter(s=>s&&s.d).length;
  });
  return {done,total};
}
function prog(){
  const {done,total}=countProgress();
  $('pt').textContent=`${done} / ${total} sets`;
  $('pb').style.width=(total?done/total*100:0)+'%';
}

function askFin(){
  const {done}=countProgress();
  if(!done){toast('Check off at least one set first.');return}
  confirmFin=true; render();
}
function commitFin(){
  let any=false;
  getEX(wk).forEach(ex=>{
    const k=key(ex), done=(S.draft[k]||[]).filter(s=>s&&s.d&&+s.r>0);
    if(done.length){
      any=true;
      const h=S.hist[ex.id]=S.hist[ex.id]||[];
      h.push({week:viewWeek,dl:!!PH(viewWeek).deload,sets:done.map(s=>({w:+s.w||0,r:+s.r}))});
      if(h.length>52) h.shift();
    }
    delete S.draft[k];
  });
  if(any){
    S.fin[viewWeek]=(S.fin[viewWeek]||0)+1;
    S.done[iso(new Date())]=wk;
  }
  confirmFin=false;
  skipRest();
  sv(); render();
  toast(any?'Session saved! Next targets updated.':'No completed sets to save.');
}

// ---- Lock-Screen-Safe Timestamp Rest Timer + Chime ----------------
let tI=null, restEnd=0;
function playBeep(){
  try{
    if(navigator.vibrate) navigator.vibrate([120,70,120]);
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    const ctx=new Ctx(), osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(880,ctx.currentTime);
    g.gain.setValueAtTime(0.12,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.35);
  }catch(e){}
}
function tickRest(){
  const rem = Math.ceil((restEnd - Date.now()) / 1000);
  if(rem <= 0){
    skipRest(); playBeep(); toast('Rest over — time for your next set!');
    return;
  }
  $('restT').textContent = `Rest ${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`;
}
function rest(s){
  clearInterval(tI);
  restEnd = Date.now() + s * 1000;
  $('rest').style.display = 'flex';
  tickRest();
  tI = setInterval(tickRest, 250);
}
function adjRest(delta){
  if(!restEnd) return;
  restEnd += delta * 1000;
  tickRest();
}
function skipRest(){
  clearInterval(tI); tI=null; restEnd=0;
  $('rest').style.display='none';
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&restEnd) tickRest()});

render();
</script>
